name: web-scrappers

services:
  olx-bot:
    build: .
    container_name: olx-bot
    command: python olx_scraper.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1

  storia-bot:
    build: .
    container_name: storia-bot
    command: python storia_scraper.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1

  publi24-bot:
    build: .
    container_name: publi24-bot
    command: python publi24_scraper.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
