name: web-scrappers

services:
  olx-bot:
    build: .
    container_name: olx-bot
    command: python olx_scraper.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: always
    healthcheck:
      # each loop (~1h) touches /tmp/heartbeat; older than 90 min = hung
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 5400"]
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 2m
    dns:
      - 8.8.8.8
      - 1.1.1.1

  storia-bot:
    build: .
    container_name: storia-bot
