version: '3.8'

services:
  olx-bot:
    build: .
    container_name: olx-bot
    command: python olx_scraper.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1

  storia-bot:
    build: .
    container_name: storia-bot
    command: python storia_scraper.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1

  publi24-bot:
    build: .
    container_name: publi24-bot
    command: python publi24_scraper.py
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Paused: gets past Cloudflare fine, but is 100% blocked by a DataDome
  # bot-verification interstitial behind it - root cause is this VPS's
  # datacenter IP reputation, not browser fingerprinting (see graphify-out/
  # notes/imobiliare-datadome.md). Needs a residential proxy or a paid
  # anti-bot API to move forward; restart left as "no" so a host reboot
  # doesn't silently spin this back up to hit the wall on a loop.
  imobiliare-bot:
    build:
      context: .
      dockerfile: Dockerfile.imobiliare
    container_name: imobiliare-bot
    command: sh -c "Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp & sleep 2 && DISPLAY=:99 exec python imobiliare_scraper.py"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - chrome-profile:/data/chrome-profile
    shm_size: 1gb
    ipc: host
    restart: "no"
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  chrome-profile: {}
